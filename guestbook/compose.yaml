services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_hea

  web:
    build: .
    expose:
           - "5000"
    ports:
      - "8080:5000"
    environment:
      APP_TITLE: "방명록"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?비밀번호 설정 필요}"
    depends_on:
       redis:
          condition: service_healthy
    healthcheck:
       test: ["CMD", "python", "-c",
        "import urllib.request;
        urllib.request.urlopen(
        'http://localhost:5000/readyz')"]
       interval: 5s
       timeout: 3s
       retries: 5
    restart: unless-stopped # 예상치 않게 종료 시 자동 재시작
  redis:
    healthcheck:
       test: ["CMD", "redis-cli", "-a",
         "${REDIS_PASSWORD}", "ping"] # 수업용
       interval: 5s
       timeout: 3s
       retries: 5
    image: redis:7-alpine
    command: ["redis-server",
       "--requirepass", "${REDIS_PASSWORD}",
       "--appendonly", "yes"]
    volumes:
       - redis-data:/data

volumes:
  redis-data:


